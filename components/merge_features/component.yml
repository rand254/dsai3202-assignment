$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: merge_features
display_name: Merge All Features
type: command

inputs:
  original_data: # ADD THIS
    type: uri_folder
    description: "Input containing the 'overall' column"
  length:
    type: uri_folder
  sentiment:
    type: uri_folder
  tfidf:
    type: uri_folder
  embedding:
    type: uri_folder

outputs:
  out:
    type: uri_folder

code: .
command: >
  python merge.py
  --original_data ${{inputs.original_data}} 
  --length ${{inputs.length}} 
  --sentiment ${{inputs.sentiment}} 
  --tfidf ${{inputs.tfidf}} 
  --embedding ${{inputs.embedding}} 
  --out ${{outputs.out}}

environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest