$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: semantic_embedding
display_name: Semantic Embedding Features
description: Create dense semantic embeddings for review text using Sentence-BERT

inputs:
  train:
    type: uri_folder
  val:
    type: uri_folder
  test:
    type: uri_folder
  text_col:
    type: string
    default: reviewText
  model_name:
    type: string
    default: all-MiniLM-L6-v2

outputs:
  train_out:
    type: uri_folder
  val_out:
    type: uri_folder
  test_out:
    type: uri_folder

code: .
environment:
  azureml:embedding-env:1

command: >
  python embedding.py
  --train ${{inputs.train}}
  --val ${{inputs.val}}
  --test ${{inputs.test}}
  --train_out ${{outputs.train_out}}
  --val_out ${{outputs.val_out}}
  --test_out ${{outputs.test_out}}
  --text_col ${{inputs.text_col}}
  --model_name ${{inputs.model_name}}