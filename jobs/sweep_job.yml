$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep

display_name: amazon_review_sweep_Alzoubi
experiment_name: amazon_review_training_experiment

compute: azureml:lab4-cluster
sampling_algorithm: random

# 1. Define inputs at the top level
inputs:
  train_data:
    type: uri_folder
    path: azureml:amazon_review_merged_features_train:1
  val_data:
    type: uri_folder
    path: azureml:amazon_review_merged_features_val:1
  test_data:
    type: uri_folder
    path: azureml:amazon_review_merged_features_test:1

# 2. Reference those inputs in the trial
trial:
  code: ../src
  command: >
    python train.py
    --train_data ${{inputs.train_data}}
    --val_data ${{inputs.val_data}}
    --test_data ${{inputs.test_data}}
    --output ${{outputs.model_output}}
    --C ${{search_space.C}}
    --max_iter ${{search_space.max_iter}}
  environment:
    image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
    conda_file: ../env/conda.yml

# 3. Outputs can stay at the trial level or top level, let's keep them here
outputs:
  model_output:
    type: uri_folder

search_space:
  C:
    type: uniform
    min_value: 0.01
    max_value: 1.0
  max_iter:
    type: choice
    values: [100, 200, 300]

objective:
  primary_metric: val_accuracy
  goal: maximize

limits:
  max_total_trials: 6
  max_concurrent_trials: 2